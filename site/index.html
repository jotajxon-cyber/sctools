<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Nosso Site — baixar vídeos e áudios</title>
  <meta name="description" content="Cole o link, escolha o formato e baixe. Simples assim." />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%2322d3ee'/%3E%3Cstop offset='.5' stop-color='%23a78bfa'/%3E%3Cstop offset='1' stop-color='%23f472b6'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='64' height='64' rx='16' fill='url(%23g)'/%3E%3Cpath d='M32 14v24m0 0l-9-9m9 9l9-9M18 46h28' stroke='%230b0d12' stroke-width='5' stroke-linecap='round' stroke-linejoin='round' fill='none'/%3E%3C/svg%3E" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="bg" aria-hidden="true">
    <div class="blob blob-a"></div>
    <div class="blob blob-b"></div>
    <div class="grid"></div>
  </div>

  <main class="app">
    <header class="hero">
      <div class="logo" aria-hidden="true">
        <svg viewBox="0 0 64 64" width="44" height="44">
          <defs>
            <linearGradient id="lg" x1="0" y1="0" x2="1" y2="1">
              <stop offset="0" stop-color="#22d3ee" />
              <stop offset=".5" stop-color="#a78bfa" />
              <stop offset="1" stop-color="#f472b6" />
            </linearGradient>
          </defs>
          <rect width="64" height="64" rx="16" fill="url(#lg)" />
          <path d="M32 14v24m0 0l-9-9m9 9l9-9M18 46h28" stroke="#0b0d12" stroke-width="5"
                stroke-linecap="round" stroke-linejoin="round" fill="none" />
        </svg>
      </div>
      <h1>Nosso <span>Site</span></h1>
      <p class="tagline">Cole o link. Escolha o formato. Baixe.</p>
    </header>

    <section class="card">
      <form id="form" autocomplete="off">
        <div class="input-row">
          <div class="input-wrap">
            <svg class="input-icon" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
              <path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"
                    fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" />
              <path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"
                    fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" />
            </svg>
            <input id="url" type="url" inputmode="url" spellcheck="false"
                   placeholder="https://www.youtube.com/watch?v=..." required />
          </div>
          <button type="button" id="paste" class="ghost" title="Colar da área de transferência">Colar</button>
        </div>

        <div class="modes" role="tablist" aria-label="Modo de download">
          <button type="button" class="mode active" data-mode="auto" role="tab" aria-selected="true">Vídeo + Áudio</button>
          <button type="button" class="mode" data-mode="audio" role="tab" aria-selected="false">Só Áudio</button>
          <button type="button" class="mode" data-mode="mute" role="tab" aria-selected="false">Só Vídeo</button>
        </div>

        <div class="options">
          <label class="field" data-when="video">
            <span>Qualidade</span>
            <select id="quality">
              <option value="max">Máxima</option>
              <option value="2160">2160p (4K)</option>
              <option value="1440">1440p (2K)</option>
              <option value="1080" selected>1080p</option>
              <option value="720">720p</option>
              <option value="480">480p</option>
              <option value="360">360p</option>
              <option value="240">240p</option>
              <option value="144">144p</option>
            </select>
          </label>

          <label class="field" data-when="audio" hidden>
            <span>Formato</span>
            <select id="format">
              <option value="mp3" selected>MP3</option>
              <option value="best">Melhor (original)</option>
              <option value="ogg">OGG</option>
              <option value="opus">Opus</option>
              <option value="wav">WAV</option>
            </select>
          </label>

          <label class="field" data-when="audio" hidden>
            <span>Bitrate</span>
            <select id="bitrate">
              <option value="320">320 kbps</option>
              <option value="256">256 kbps</option>
              <option value="128" selected>128 kbps</option>
              <option value="96">96 kbps</option>
              <option value="64">64 kbps</option>
              <option value="8">8 kbps</option>
            </select>
          </label>
        </div>

        <details class="advanced">
          <summary>Avançado</summary>
          <div class="adv-grid">
            <label class="field" data-when="video">
              <span>Codec (YouTube)</span>
              <select id="codec">
                <option value="h264" selected>H.264 (compatível)</option>
                <option value="av1">AV1</option>
                <option value="vp9">VP9</option>
              </select>
            </label>
            <label class="field" data-when="video">
              <span>Container</span>
              <select id="container">
                <option value="auto" selected>Auto</option>
                <option value="mp4">MP4</option>
                <option value="webm">WebM</option>
                <option value="mkv">MKV</option>
              </select>
            </label>
            <label class="check">
              <input type="checkbox" id="betterAudio" />
              <span>Áudio do YouTube em melhor qualidade</span>
            </label>
            <label class="check">
              <input type="checkbox" id="alwaysProxy" />
              <span>Sempre baixar via túnel</span>
            </label>
          </div>
        </details>

        <button id="go" class="primary" type="submit">
          <svg class="go-icon" viewBox="0 0 24 24" width="20" height="20" aria-hidden="true">
            <path d="M12 4v11m0 0l-4-4m4 4l4-4M5 20h14" fill="none" stroke="currentColor"
                  stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
          </svg>
          <span class="spinner" aria-hidden="true"></span>
          <span class="label">Baixar</span>
        </button>
      </form>

      <div id="status" class="status" role="status" hidden></div>
      <div id="result" class="result" hidden></div>
      <div id="picker" class="picker" hidden></div>
    </section>

    <section id="historyWrap" class="history" hidden>
      <div class="history-head">
        <h2>Recentes</h2>
        <button id="clearHistory" class="link small">limpar</button>
      </div>
      <ul id="history"></ul>
    </section>

    <footer class="foot">
      <span class="api-state" id="apiState" title="Status da API">
        <i></i><button id="apiBtn" class="link">API</button>
      </span>
      <span class="dot-sep">•</span>
      <span>use com responsabilidade</span>
    </footer>
  </main>

  <div id="toast" class="toast" role="status" hidden></div>

  <script src="app.js" type="module"></script>
</body>
</html>
